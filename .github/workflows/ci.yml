name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      # Test chạy offline hoàn toàn (respx mock HTTP). Test đánh dấu `live`
      # bị loại mặc định qua addopts trong pyproject.
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: web
      - run: npx astro check
        working-directory: web
        continue-on-error: true # astro check cần tải type, đừng để chặn CI
      - run: npx astro build
        working-directory: web
