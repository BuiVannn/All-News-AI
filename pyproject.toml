[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-radar"
version = "0.1.0"
description = "Gom paper, model release, tin ra mắt và tooling AI về một feed duy nhất, có lọc và tóm tắt tiếng Việt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ai-radar = "ai_radar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
